<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Cyber Security Shield Outline -->
  <path d="M64 22 L96 36 C96 68 84 94 64 106 C44 94 32 68 32 36 Z" 
        fill="#090d16" 
        stroke="url(#neonGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Stylized "K" Cyber Monogram -->
  <g fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Bar -->
    <path d="M52 46 L52 82"/>
    <!-- Top Diagonal Arm -->
    <path d="M78 48 L54 64"/>
    <!-- Bottom Diagonal Leg -->
    <path d="M62 59 L80 82"/>
    <!-- Glowing Node at center -->
    <circle cx="53" cy="64" r="3.5" fill="#38bdf8"/>
    <circle cx="78" cy="48" r="2.5" fill="#10b981"/>
    <circle cx="80" cy="82" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
