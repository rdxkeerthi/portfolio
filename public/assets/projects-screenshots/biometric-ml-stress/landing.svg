<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#070b14;font-family:'Space Grotesk',Inter,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1527" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" />
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)" />
  </g>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1920" height="90" fill="#0b1120" opacity="0.9" />
  <line x1="0" y1="90" x2="1920" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="60" cy="45" r="18" fill="#06b6d4" opacity="0.2" />
  <path d="M50 45 L58 37 L70 45 L58 53 Z" fill="none" stroke="#06b6d4" stroke-width="2.5" />
  <text x="95" y="42" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1.5">BIOMETRIC ML THREAT DETECTION</text>
  <text x="95" y="65" fill="#64748b" font-size="14" font-family="monospace">SYSTEM v3.2 // AI FACIAL TELEMETRY &amp; rPPG PULSE ESTIMATION</text>
  
  <!-- Status Badge -->
  <rect x="1600" y="28" width="260" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5" />
  <circle cx="1625" cy="45" r="5" fill="#10b981" filter="url(#glow)" />
  <text x="1645" y="51" fill="#10b981" font-size="14" font-weight="600" letter-spacing="1">AUTHENTICATION: LIVE</text>

  <!-- Left Card: 3D Facial Landmark Tracking -->
  <rect x="60" y="120" width="580" height="520" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="90" y="165" fill="#f8fafc" font-size="18" font-weight="600">3D Facial Landmark Mesh (468 Pts)</text>
  <text x="90" y="190" fill="#64748b" font-size="13" font-family="monospace">MediaPipe 60 FPS Real-time Extraction</text>
  
  <!-- Face Mesh Graphic -->
  <g transform="translate(350, 380)" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.85">
    <ellipse cx="0" cy="0" rx="130" ry="170" stroke="rgba(6,182,212,0.4)" stroke-dasharray="4,4" />
    <path d="M-80 -40 Q0 -80 80 -40 Q100 60 0 140 Q-100 60 -80 -40" stroke="#06b6d4" />
    <!-- Eyes -->
    <ellipse cx="-45" cy="-25" rx="28" ry="14" stroke="#38bdf8" />
    <circle cx="-45" cy="-25" r="6" fill="#38bdf8" />
    <ellipse cx="45" cy="-25" rx="28" ry="14" stroke="#38bdf8" />
    <circle cx="45" cy="-25" r="6" fill="#38bdf8" />
    <!-- Nose & Mouth -->
    <path d="M0 -30 L0 30 L-18 45 L18 45 Z" stroke="#38bdf8" />
    <path d="M-40 85 Q0 115 40 85 Q0 70 -40 85" stroke="#38bdf8" />
    <!-- Landmark Mesh Points -->
    <circle cx="-70" cy="-60" r="3" fill="#10b981" />
    <circle cx="70" cy="-60" r="3" fill="#10b981" />
    <circle cx="0" cy="-75" r="3" fill="#10b981" />
    <circle cx="-100" cy="20" r="3" fill="#10b981" />
    <circle cx="100" cy="20" r="3" fill="#10b981" />
    <circle cx="0" cy="135" r="3" fill="#10b981" />
    <!-- Gaze Vectors -->
    <line x1="-45" y1="-25" x2="-85" y2="-45" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="45" y1="-25" x2="5" y2="-45" stroke="#ec4899" stroke-width="2" />
  </g>
  <rect x="90" y="580" width="520" height="40" rx="8" fill="rgba(6,182,212,0.08)" />
  <text x="110" y="605" fill="#38bdf8" font-size="13" font-family="monospace">Gaze Deflection: 4.2° | Micro-blink Freq: 14/min (NORMAL)</text>

  <!-- Center Card: rPPG Photoplethysmography Pulse Waveform -->
  <rect x="670" y="120" width="670" height="520" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="700" y="165" fill="#f8fafc" font-size="18" font-weight="600">rPPG Remote Pulse Telemetry (BVP Waveform)</text>
  <text x="700" y="190" fill="#64748b" font-size="13" font-family="monospace">RGB Chrominance Blood Volume Pulse Signature</text>

  <!-- BPM Display -->
  <text x="1200" y="185" fill="#10b981" font-size="36" font-weight="700">72 <tspan font-size="16" fill="#64748b">BPM</tspan></text>

  <!-- Pulse Waveform Graph -->
  <g transform="translate(700, 240)">
    <rect width="610" height="260" rx="10" fill="#080e1a" stroke="rgba(255,255,255,0.05)" />
    <!-- Grid Lines -->
    <line x1="0" y1="65" x2="610" y2="65" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
    <line x1="0" y1="130" x2="610" y2="130" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
    <line x1="0" y1="195" x2="610" y2="195" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
    
    <!-- Heartbeat Curve -->
    <path d="M 0 130 
             Q 30 130 50 130 L 65 130 L 75 80 L 88 180 L 102 40 L 115 150 L 125 120 L 140 130 
             Q 180 130 200 130 L 215 130 L 225 80 L 238 180 L 252 40 L 265 150 L 275 120 L 290 130
             Q 330 130 350 130 L 365 130 L 375 80 L 388 180 L 402 40 L 415 150 L 425 120 L 440 130
             Q 480 130 500 130 L 515 130 L 525 80 L 538 180 L 552 40 L 565 150 L 575 120 L 610 130" 
          fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glow)" />
    
    <!-- Secondary FFT Spectral Wave -->
    <path d="M 0 210 Q 50 180 100 210 T 200 210 T 300 210 T 400 210 T 500 210 T 610 210" 
          fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.6" stroke-dasharray="3,3" />
  </g>
  <text x="700" y="580" fill="#94a3b8" font-size="13" font-family="monospace">HRV (SDNN): 48.6 ms // Signal-to-Noise Ratio: 18.4 dB [OPTIMAL]</text>

  <!-- Right Card: Random Forest Classifier Stress Metrics -->
  <rect x="1370" y="120" width="490" height="520" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="1400" y="165" fill="#f8fafc" font-size="18" font-weight="600">ML Stress Risk Score</text>
  <text x="1400" y="190" fill="#64748b" font-size="13" font-family="monospace">Scikit-Learn Random Forest (AUs)</text>

  <!-- Gauge Arc -->
  <g transform="translate(1615, 340)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1e293b" stroke-width="16" />
    <path d="M -90 40 A 100 100 0 1 1 90 40" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" />
    <text x="0" y="10" fill="#f8fafc" font-size="44" font-weight="800" text-anchor="middle">94%</text>
    <text x="0" y="40" fill="#10b981" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">AUTHENTIC</text>
  </g>

  <!-- Action Units Breakdown -->
  <g transform="translate(1400, 480)">
    <text x="0" y="0" fill="#cbd5e1" font-size="13">AU04 (Brow Lowerer)</text>
    <rect x="170" y="-12" width="260" height="12" rx="6" fill="#1e293b" />
    <rect x="170" y="-12" width="45" height="12" rx="6" fill="#10b981" />

    <text x="0" y="30" fill="#cbd5e1" font-size="13">AU07 (Lid Tightener)</text>
    <rect x="170" y="18" width="260" height="12" rx="6" fill="#1e293b" />
    <rect x="170" y="18" width="30" height="12" rx="6" fill="#10b981" />

    <text x="0" y="60" fill="#cbd5e1" font-size="13">AU12 (Lip Corner Puller)</text>
    <rect x="170" y="48" width="260" height="12" rx="6" fill="#1e293b" />
    <rect x="170" y="48" width="190" height="12" rx="6" fill="#06b6d4" />
  </g>

  <!-- Bottom Panel: Security Audit Event Log -->
  <rect x="60" y="670" width="1800" height="360" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="90" y="715" fill="#f8fafc" font-size="18" font-weight="600">High-Security Authentication Audit Telemetry</text>
  
  <g transform="translate(90, 755)" font-family="monospace" font-size="14">
    <!-- Row 1 -->
    <text x="0" y="0" fill="#64748b">[14:32:01.104]</text>
    <text x="170" y="0" fill="#38bdf8">FRAME_INGEST</text>
    <text x="350" y="0" fill="#e2e8f0">Extracted 468 mesh landmarks. Inter-pupillary distance: 63.4mm (Calibrated)</text>
    <text x="1600" y="0" fill="#10b981">PASSED</text>
    <line x1="0" y1="15" x2="1740" y2="15" stroke="rgba(255,255,255,0.06)" />

    <!-- Row 2 -->
    <text x="0" y="40" fill="#64748b">[14:32:01.320]</text>
    <text x="170" y="40" fill="#a855f7">rPPG_EXTRACT</text>
    <text x="350" y="40" fill="#e2e8f0">Photoplethysmography window buffer calculated: 72.1 BPM, SNR=18.4dB</text>
    <text x="1600" y="40" fill="#10b981">PASSED</text>
    <line x1="0" y1="55" x2="1740" y2="55" stroke="rgba(255,255,255,0.06)" />

    <!-- Row 3 -->
    <text x="0" y="80" fill="#64748b">[14:32:01.550]</text>
    <text x="170" y="80" fill="#10b981">ML_CLASSIFY</text>
    <text x="350" y="80" fill="#e2e8f0">Random Forest AU feature vector evaluated. Deception / Stress probability: 0.04</text>
    <text x="1600" y="80" fill="#10b981">PASSED</text>
    <line x1="0" y1="95" x2="1740" y2="95" stroke="rgba(255,255,255,0.06)" />

    <!-- Row 4 -->
    <text x="0" y="120" fill="#64748b">[14:32:01.810]</text>
    <text x="170" y="120" fill="#f59e0b">MFA_VERIFY</text>
    <text x="350" y="120" fill="#e2e8f0">Zero-Trust High-Security Token issued: e2a94f1c-7b89-482a-99ef-55b6c08e1a42</text>
    <text x="1600" y="120" fill="#10b981">AUTHORIZED</text>
  </g>
</svg>
